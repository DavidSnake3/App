<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d14" />
    <meta name="description" content="SNBusiness: tus gastos, servicios y deudas bajo control, con planes de pago inteligentes." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SNBusiness" />
    <title>SNBusiness — Finanzas personales</title>
    <style>
      html, body { margin: 0; padding: 0; background: #0b0d14; }
      #root { min-height: 100vh; }
      #boot-error {
        display: none; position: fixed; inset: 0; background: #1a0010;
        color: #f87171; font-family: monospace; font-size: 12px;
        padding: 40px 16px; overflow: auto; z-index: 9999; white-space: pre-wrap;
      }
    </style>
    <script>
      window.onerror = function(msg, src, line, col, err) {
        var el = document.getElementById('boot-error');
        if (el) { el.style.display = 'block'; el.textContent = 'ERROR:\n' + msg + '\n' + src + ':' + line + '\n' + (err && err.stack ? err.stack : ''); }
      };
      window.addEventListener('unhandledrejection', function(e) {
        var el = document.getElementById('boot-error');
        if (el) { el.style.display = 'block'; el.textContent = 'PROMISE ERROR:\n' + (e.reason && e.reason.stack ? e.reason.stack : String(e.reason)); }
      });
    </script>
  </head>
  <body>
    <div id="boot-error"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
